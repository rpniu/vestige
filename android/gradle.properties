org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Windows 跨盘符构建修复（必须保留）────────────────────────────────
# 本机 pub cache 在 C:\Users\xx\AppData\Local\Pub\Cache，项目在 D:\projects\…，
# 而 android/build.gradle.kts 把所有插件子工程的 buildDir 重定向到 D:\…\build\<插件>。
# 于是 Kotlin 增量编译缓存要计算「源码( C: ) 相对 构建根( D: )」的相对路径，
# RelocatableFileToPathConverter 直接抛：
#   IllegalArgumentException: this and base files have different roots
#   → Could not close incremental caches in build\<插件>\kotlin\compileDebugKotlin\...
# 关掉增量缓存即可规避（插件模块每次全量编译，代价可接受）。
kotlin.incremental=false
